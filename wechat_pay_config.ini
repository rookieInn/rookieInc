[WECHAT_PAY]
# 微信支付商户号
merchant_id = your_merchant_id_here
# 小程序AppID
app_id = your_miniprogram_appid_here
# 微信支付API密钥
api_key = your_wechat_pay_api_key_here
# 微信支付证书路径
cert_path = cert/apiclient_cert.pem
# 微信支付私钥路径
key_path = cert/apiclient_key.pem
# 支付回调通知URL
notify_url = https://yourdomain.com/api/wechat/pay/notify
# 支付结果查询URL
query_url = https://yourdomain.com/api/wechat/pay/query
# 退款回调通知URL
refund_notify_url = https://yourdomain.com/api/wechat/pay/refund/notify

[WECHAT_PAY_SETTINGS]
# 支付超时时间（分钟）
timeout_minutes = 30
# 是否启用沙箱环境
sandbox_mode = false
# 沙箱环境API密钥
sandbox_api_key = your_sandbox_api_key_here
# 日志级别
log_level = INFO
# 是否启用调试模式
debug_mode = false

[SECURITY]
# 签名算法
sign_type = MD5
# 字符编码
charset = UTF-8
# 是否验证签名
verify_signature = true
# 允许的IP白名单（逗号分隔）
allowed_ips = 127.0.0.1,192.168.1.0/24

[DATABASE]
# 数据库类型
db_type = sqlite
# 数据库连接字符串
db_url = sqlite:///wechat_pay.db
# 支付记录表名
payments_table = payments
# 退款记录表名
refunds_table = refunds

[LOGGING]
# 日志文件路径
log_file = logs/wechat_pay.log
# 日志文件最大大小（MB）
max_file_size = 10
# 保留的日志文件数量
backup_count = 5