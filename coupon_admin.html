<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优惠券管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .coupon-card {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .coupon-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: rotate(45deg);
        }
        
        .coupon-type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .stats-number {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .table-hover tbody tr:hover {
            background-color: #f8f9fa;
        }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-active {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status-draft {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .status-expired {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .status-paused {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
        }
        
        .btn-gradient:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 顶部导航 -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <i class="bi bi-ticket-perforated"></i> 优惠券管理系统
                </a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="#" onclick="showCreateModal()">
                        <i class="bi bi-plus-circle"></i> 创建优惠券
                    </a>
                </div>
            </div>
        </nav>

        <!-- 统计卡片 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">总优惠券数</h6>
                            <div class="stats-number" id="totalCoupons">0</div>
                        </div>
                        <i class="bi bi-ticket-perforated" style="font-size: 2rem; opacity: 0.7;"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">活跃优惠券</h6>
                            <div class="stats-number" id="activeCoupons">0</div>
                        </div>
                        <i class="bi bi-check-circle" style="font-size: 2rem; opacity: 0.7;"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">今日使用</h6>
                            <div class="stats-number" id="todayUsage">0</div>
                        </div>
                        <i class="bi bi-graph-up" style="font-size: 2rem; opacity: 0.7;"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="mb-1">总折扣金额</h6>
                            <div class="stats-number" id="totalDiscount">¥0</div>
                        </div>
                        <i class="bi bi-currency-dollar" style="font-size: 2rem; opacity: 0.7;"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 筛选和搜索 -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <label class="form-label">优惠券类型</label>
                                <select class="form-select" id="filterType">
                                    <option value="">全部类型</option>
                                    <option value="fixed_amount">固定金额</option>
                                    <option value="percentage">百分比折扣</option>
                                    <option value="free_shipping">免运费</option>
                                    <option value="buy_x_get_y">买X送Y</option>
                                    <option value="cashback">返现</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">状态</label>
                                <select class="form-select" id="filterStatus">
                                    <option value="">全部状态</option>
                                    <option value="draft">草稿</option>
                                    <option value="active">激活</option>
                                    <option value="paused">暂停</option>
                                    <option value="expired">过期</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">搜索</label>
                                <input type="text" class="form-control" id="searchInput" placeholder="搜索优惠券名称或代码">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">&nbsp;</label>
                                <button class="btn btn-gradient w-100" onclick="loadCoupons()">
                                    <i class="bi bi-search"></i> 搜索
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 优惠券列表 -->
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">优惠券列表</h5>
                        <div>
                            <button class="btn btn-outline-primary btn-sm" onclick="loadCoupons()">
                                <i class="bi bi-arrow-clockwise"></i> 刷新
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>优惠券代码</th>
                                        <th>名称</th>
                                        <th>类型</th>
                                        <th>折扣值</th>
                                        <th>最低订单金额</th>
                                        <th>使用数量</th>
                                        <th>状态</th>
                                        <th>有效期</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="couponsTableBody">
                                    <!-- 数据将通过JavaScript动态加载 -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- 分页 -->
                        <nav aria-label="优惠券分页">
                            <ul class="pagination justify-content-center" id="pagination">
                                <!-- 分页将通过JavaScript动态生成 -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建/编辑优惠券模态框 -->
    <div class="modal fade" id="couponModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">创建优惠券</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="couponForm">
                        <input type="hidden" id="couponId">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">优惠券名称 *</label>
                                    <input type="text" class="form-control" id="couponName" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">优惠券类型 *</label>
                                    <select class="form-select" id="couponType" required>
                                        <option value="fixed_amount">固定金额减免</option>
                                        <option value="percentage">百分比折扣</option>
                                        <option value="free_shipping">免运费</option>
                                        <option value="buy_x_get_y">买X送Y</option>
                                        <option value="cashback">返现</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">描述</label>
                            <textarea class="form-control" id="couponDescription" rows="3"></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">折扣值 *</label>
                                    <input type="number" class="form-control" id="discountValue" step="0.01" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">最低订单金额</label>
                                    <input type="number" class="form-control" id="minOrderAmount" step="0.01" value="0">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">最大折扣金额</label>
                                    <input type="number" class="form-control" id="maxDiscountAmount" step="0.01">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">总发行数量</label>
                                    <input type="number" class="form-control" id="totalQuantity" value="0">
                                    <div class="form-text">0表示无限制</div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">每用户限用次数</label>
                                    <input type="number" class="form-control" id="perUserLimit" value="1">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">有效天数</label>
                                    <input type="number" class="form-control" id="validDays" value="30">
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="isPublic" checked>
                                        <label class="form-check-label" for="isPublic">
                                            公开优惠券
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">优先级</label>
                                    <input type="number" class="form-control" id="priority" value="0">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-gradient" onclick="saveCoupon()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 优惠券详情模态框 -->
    <div class="modal fade" id="couponDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">优惠券详情</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="couponDetailContent">
                    <!-- 详情内容将通过JavaScript动态加载 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量
        let currentPage = 1;
        let totalPages = 1;
        let coupons = [];

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadCoupons();
            loadStatistics();
        });

        // 加载优惠券列表
        async function loadCoupons(page = 1) {
            try {
                const params = new URLSearchParams({
                    page: page,
                    per_page: 10,
                    status: document.getElementById('filterStatus').value,
                    coupon_type: document.getElementById('filterType').value
                });

                const response = await fetch(`/api/coupons?${params}`);
                const result = await response.json();

                if (result.success) {
                    coupons = result.data.coupons;
                    currentPage = result.data.pagination.page;
                    totalPages = result.data.pagination.pages;
                    renderCouponsTable();
                    renderPagination();
                } else {
                    alert('加载优惠券列表失败: ' + result.message);
                }
            } catch (error) {
                console.error('加载优惠券列表失败:', error);
                alert('加载优惠券列表失败: ' + error.message);
            }
        }

        // 渲染优惠券表格
        function renderCouponsTable() {
            const tbody = document.getElementById('couponsTableBody');
            tbody.innerHTML = '';

            coupons.forEach(coupon => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><code>${coupon.code}</code></td>
                    <td>${coupon.name}</td>
                    <td>${getCouponTypeText(coupon.coupon_type)}</td>
                    <td>${formatDiscountValue(coupon.coupon_type, coupon.discount_value)}</td>
                    <td>¥${coupon.min_order_amount}</td>
                    <td>${coupon.used_quantity}/${coupon.total_quantity || '∞'}</td>
                    <td><span class="status-badge status-${coupon.status}">${getStatusText(coupon.status)}</span></td>
                    <td>${formatDate(coupon.valid_until)}</td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-primary" onclick="viewCoupon(${coupon.id})">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-outline-warning" onclick="editCoupon(${coupon.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-outline-danger" onclick="deleteCoupon(${coupon.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 渲染分页
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';

            // 上一页
            const prevLi = document.createElement('li');
            prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
            prevLi.innerHTML = `<a class="page-link" href="#" onclick="loadCoupons(${currentPage - 1})">上一页</a>`;
            pagination.appendChild(prevLi);

            // 页码
            for (let i = 1; i <= totalPages; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === currentPage ? 'active' : ''}`;
                li.innerHTML = `<a class="page-link" href="#" onclick="loadCoupons(${i})">${i}</a>`;
                pagination.appendChild(li);
            }

            // 下一页
            const nextLi = document.createElement('li');
            nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
            nextLi.innerHTML = `<a class="page-link" href="#" onclick="loadCoupons(${currentPage + 1})">下一页</a>`;
            pagination.appendChild(nextLi);
        }

        // 加载统计数据
        async function loadStatistics() {
            // 这里应该调用统计API，暂时使用模拟数据
            document.getElementById('totalCoupons').textContent = '156';
            document.getElementById('activeCoupons').textContent = '89';
            document.getElementById('todayUsage').textContent = '23';
            document.getElementById('totalDiscount').textContent = '¥12,456';
        }

        // 显示创建优惠券模态框
        function showCreateModal() {
            document.getElementById('modalTitle').textContent = '创建优惠券';
            document.getElementById('couponForm').reset();
            document.getElementById('couponId').value = '';
            new bootstrap.Modal(document.getElementById('couponModal')).show();
        }

        // 编辑优惠券
        async function editCoupon(couponId) {
            try {
                const response = await fetch(`/api/coupons/${couponId}`);
                const result = await response.json();

                if (result.success) {
                    const coupon = result.data;
                    document.getElementById('modalTitle').textContent = '编辑优惠券';
                    document.getElementById('couponId').value = coupon.id;
                    document.getElementById('couponName').value = coupon.name;
                    document.getElementById('couponDescription').value = coupon.description || '';
                    document.getElementById('couponType').value = coupon.coupon_type;
                    document.getElementById('discountValue').value = coupon.discount_value;
                    document.getElementById('minOrderAmount').value = coupon.min_order_amount;
                    document.getElementById('maxDiscountAmount').value = coupon.max_discount_amount || '';
                    document.getElementById('totalQuantity').value = coupon.total_quantity;
                    document.getElementById('perUserLimit').value = coupon.per_user_limit;
                    document.getElementById('isPublic').checked = coupon.is_public;
                    document.getElementById('priority').value = coupon.priority;
                    
                    new bootstrap.Modal(document.getElementById('couponModal')).show();
                } else {
                    alert('获取优惠券详情失败: ' + result.message);
                }
            } catch (error) {
                console.error('获取优惠券详情失败:', error);
                alert('获取优惠券详情失败: ' + error.message);
            }
        }

        // 查看优惠券详情
        async function viewCoupon(couponId) {
            try {
                const response = await fetch(`/api/coupons/${couponId}`);
                const result = await response.json();

                if (result.success) {
                    const coupon = result.data;
                    const content = document.getElementById('couponDetailContent');
                    content.innerHTML = `
                        <div class="row">
                            <div class="col-md-6">
                                <h6>基本信息</h6>
                                <table class="table table-sm">
                                    <tr><td>优惠券代码</td><td><code>${coupon.code}</code></td></tr>
                                    <tr><td>名称</td><td>${coupon.name}</td></tr>
                                    <tr><td>类型</td><td>${getCouponTypeText(coupon.coupon_type)}</td></tr>
                                    <tr><td>折扣值</td><td>${formatDiscountValue(coupon.coupon_type, coupon.discount_value)}</td></tr>
                                    <tr><td>最低订单金额</td><td>¥${coupon.min_order_amount}</td></tr>
                                    <tr><td>最大折扣金额</td><td>${coupon.max_discount_amount ? '¥' + coupon.max_discount_amount : '无限制'}</td></tr>
                                </table>
                            </div>
                            <div class="col-md-6">
                                <h6>使用限制</h6>
                                <table class="table table-sm">
                                    <tr><td>总发行数量</td><td>${coupon.total_quantity || '无限制'}</td></tr>
                                    <tr><td>已使用数量</td><td>${coupon.used_quantity}</td></tr>
                                    <tr><td>每用户限用次数</td><td>${coupon.per_user_limit}</td></tr>
                                    <tr><td>状态</td><td><span class="status-badge status-${coupon.status}">${getStatusText(coupon.status)}</span></td></tr>
                                    <tr><td>有效期开始</td><td>${formatDate(coupon.valid_from)}</td></tr>
                                    <tr><td>有效期结束</td><td>${formatDate(coupon.valid_until)}</td></tr>
                                </table>
                            </div>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-12">
                                <h6>描述</h6>
                                <p>${coupon.description || '无描述'}</p>
                            </div>
                        </div>
                    `;
                    new bootstrap.Modal(document.getElementById('couponDetailModal')).show();
                } else {
                    alert('获取优惠券详情失败: ' + result.message);
                }
            } catch (error) {
                console.error('获取优惠券详情失败:', error);
                alert('获取优惠券详情失败: ' + error.message);
            }
        }

        // 保存优惠券
        async function saveCoupon() {
            try {
                const formData = {
                    name: document.getElementById('couponName').value,
                    description: document.getElementById('couponDescription').value,
                    coupon_type: document.getElementById('couponType').value,
                    discount_value: parseFloat(document.getElementById('discountValue').value),
                    min_order_amount: parseFloat(document.getElementById('minOrderAmount').value) || 0,
                    max_discount_amount: parseFloat(document.getElementById('maxDiscountAmount').value) || null,
                    total_quantity: parseInt(document.getElementById('totalQuantity').value) || 0,
                    per_user_limit: parseInt(document.getElementById('perUserLimit').value) || 1,
                    valid_days: parseInt(document.getElementById('validDays').value) || 30,
                    is_public: document.getElementById('isPublic').checked,
                    priority: parseInt(document.getElementById('priority').value) || 0,
                    created_by: 1 // 实际应用中从认证信息获取
                };

                const couponId = document.getElementById('couponId').value;
                const url = couponId ? `/api/coupons/${couponId}` : '/api/coupons';
                const method = couponId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('优惠券保存成功');
                    bootstrap.Modal.getInstance(document.getElementById('couponModal')).hide();
                    loadCoupons(currentPage);
                } else {
                    alert('保存优惠券失败: ' + result.message);
                }
            } catch (error) {
                console.error('保存优惠券失败:', error);
                alert('保存优惠券失败: ' + error.message);
            }
        }

        // 删除优惠券
        async function deleteCoupon(couponId) {
            if (confirm('确定要删除这个优惠券吗？')) {
                try {
                    const response = await fetch(`/api/coupons/${couponId}`, {
                        method: 'DELETE'
                    });

                    const result = await response.json();

                    if (result.success) {
                        alert('优惠券删除成功');
                        loadCoupons(currentPage);
                    } else {
                        alert('删除优惠券失败: ' + result.message);
                    }
                } catch (error) {
                    console.error('删除优惠券失败:', error);
                    alert('删除优惠券失败: ' + error.message);
                }
            }
        }

        // 工具函数
        function getCouponTypeText(type) {
            const types = {
                'fixed_amount': '固定金额',
                'percentage': '百分比折扣',
                'free_shipping': '免运费',
                'buy_x_get_y': '买X送Y',
                'cashback': '返现'
            };
            return types[type] || type;
        }

        function formatDiscountValue(type, value) {
            if (type === 'percentage') {
                return value + '%';
            } else if (type === 'free_shipping') {
                return '免运费';
            } else {
                return '¥' + value;
            }
        }

        function getStatusText(status) {
            const statuses = {
                'draft': '草稿',
                'active': '激活',
                'paused': '暂停',
                'expired': '过期',
                'deleted': '删除'
            };
            return statuses[status] || status;
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('zh-CN');
        }
    </script>
</body>
</html>
