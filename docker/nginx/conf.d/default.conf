# OSS监控仪表板
server {
    listen 80;
    server_name oss.localhost;

    location / {
        proxy_pass http://oss_monitor;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态文件缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://oss_monitor;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# 页面埋点API
server {
    listen 80;
    server_name api.localhost;

    location / {
        proxy_pass http://tracking_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS支持
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
        
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }
    }
}

# 视频水印服务
server {
    listen 80;
    server_name video.localhost;

    location / {
        proxy_pass http://video_watermark;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 文件上传大小限制
        client_max_body_size 500M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# 默认服务器 - 服务概览
server {
    listen 80 default_server;
    server_name _;

    location / {
        return 200 '
        <!DOCTYPE html>
        <html>
        <head>
            <title>服务概览</title>
            <meta charset="utf-8">
            <style>
                body { font-family: Arial, sans-serif; margin: 40px; }
                .service { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
                .service h3 { margin-top: 0; color: #333; }
                .service a { color: #007bff; text-decoration: none; }
                .service a:hover { text-decoration: underline; }
            </style>
        </head>
        <body>
            <h1>🚀 多服务部署概览</h1>
            <div class="service">
                <h3>📊 OSS监控仪表板</h3>
                <p>监控对象存储使用情况和趋势</p>
                <a href="http://oss.localhost">访问服务</a>
            </div>
            <div class="service">
                <h3>📈 页面埋点API</h3>
                <p>收集和分析用户行为数据</p>
                <a href="http://api.localhost">访问服务</a>
            </div>
            <div class="service">
                <h3>🎬 视频水印服务</h3>
                <p>为视频添加水印和特效</p>
                <a href="http://video.localhost">访问服务</a>
            </div>
            <div class="service">
                <h3>📊 监控面板</h3>
                <p>系统监控和性能分析</p>
                <a href="http://localhost:3000">Grafana</a> | 
                <a href="http://localhost:9090">Prometheus</a>
            </div>
        </body>
        </html>';
        add_header Content-Type text/html;
    }
}