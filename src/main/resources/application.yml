server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: springboot-api-timing

# 日志配置
logging:
  level:
    com.example.springbootapitiming: INFO
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always