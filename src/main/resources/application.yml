# Spring Boot 应用配置
server:
  port: 8080
  servlet:
    context-path: /
  # 配置服务器超时等参数
  tomcat:
    max-connections: 8192
    max-threads: 200
    min-spare-threads: 10

# Spring Boot 应用信息
spring:
  application:
    name: cors-demo
  profiles:
    active: dev
  
  # 开发环境配置
  profiles:
    dev:
      cors:
        allowed-origins: "*"
        allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
        allowed-headers: "*"
        allow-credentials: true
        max-age: 3600

# 日志配置
logging:
  level:
    com.example.corsdemo: DEBUG
    org.springframework.web.cors: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/cors-demo.log

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 自定义配置
cors:
  # 生产环境CORS配置
  production:
    allowed-origins:
      - "https://yourdomain.com"
      - "https://www.yourdomain.com"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "Authorization"
      - "Content-Type"
      - "X-Requested-With"
      - "Accept"
      - "Origin"
    allow-credentials: true
    max-age: 3600
  
  # 开发环境CORS配置
  development:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600