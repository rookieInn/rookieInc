<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI旅游路线规划系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-route me-2"></i>AI旅游路线规划
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#home">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#planner">路线规划</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#my-plans">我的计划</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#chat">AI助手</a>
                    </li>
                </ul>
                <div class="navbar-nav">
                    <button class="btn btn-outline-light me-2" id="loginBtn">登录</button>
                    <button class="btn btn-light" id="registerBtn">注册</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <main class="container-fluid">
        <!-- 首页区域 -->
        <section id="home" class="hero-section">
            <div class="container">
                <div class="row align-items-center min-vh-100">
                    <div class="col-lg-6">
                        <h1 class="display-4 fw-bold text-primary mb-4">
                            智能旅游路线规划
                        </h1>
                        <p class="lead mb-4">
                            基于AI技术的个性化旅游路线规划系统，为您量身定制完美的旅行体验
                        </p>
                        <div class="d-flex gap-3">
                            <button class="btn btn-primary btn-lg" onclick="showSection('planner')">
                                <i class="fas fa-route me-2"></i>开始规划
                            </button>
                            <button class="btn btn-outline-primary btn-lg" onclick="showSection('chat')">
                                <i class="fas fa-robot me-2"></i>AI助手
                            </button>
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="hero-image">
                            <i class="fas fa-map-marked-alt fa-10x text-primary opacity-50"></i>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 路线规划区域 -->
        <section id="planner" class="py-5" style="display: none;">
            <div class="container">
                <div class="row">
                    <div class="col-lg-4">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-cog me-2"></i>规划设置
                                </h5>
                            </div>
                            <div class="card-body">
                                <form id="planForm">
                                    <div class="mb-3">
                                        <label for="destination" class="form-label">目的地 *</label>
                                        <input type="text" class="form-control" id="destination" required>
                                    </div>
                                    <div class="row mb-3">
                                        <div class="col-6">
                                            <label for="startDate" class="form-label">开始日期 *</label>
                                            <input type="date" class="form-control" id="startDate" required>
                                        </div>
                                        <div class="col-6">
                                            <label for="endDate" class="form-label">结束日期 *</label>
                                            <input type="date" class="form-control" id="endDate" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="budget" class="form-label">预算 (元)</label>
                                        <input type="number" class="form-control" id="budget" min="0">
                                    </div>
                                    <div class="mb-3">
                                        <label for="travelType" class="form-label">旅行类型</label>
                                        <select class="form-select" id="travelType">
                                            <option value="">请选择</option>
                                            <option value="亲子游">亲子游</option>
                                            <option value="蜜月游">蜜月游</option>
                                            <option value="独自旅行">独自旅行</option>
                                            <option value="朋友聚会">朋友聚会</option>
                                            <option value="商务旅行">商务旅行</option>
                                            <option value="休闲游">休闲游</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="preferences" class="form-label">偏好设置</label>
                                        <textarea class="form-control" id="preferences" rows="3" 
                                                  placeholder="请描述您的旅行偏好..."></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="fas fa-magic me-2"></i>生成路线
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-8">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-map me-2"></i>路线规划结果
                                </h5>
                                <div class="btn-group" role="group">
                                    <button class="btn btn-outline-primary btn-sm" id="mapViewBtn">
                                        <i class="fas fa-map me-1"></i>地图视图
                                    </button>
                                    <button class="btn btn-outline-primary btn-sm" id="listViewBtn">
                                        <i class="fas fa-list me-1"></i>列表视图
                                    </button>
                                </div>
                            </div>
                            <div class="card-body">
                                <div id="planResult" class="text-center text-muted">
                                    <i class="fas fa-route fa-3x mb-3"></i>
                                    <p>请填写左侧表单并点击"生成路线"开始规划</p>
                                </div>
                                <div id="mapContainer" style="height: 400px; display: none;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 我的计划区域 -->
        <section id="my-plans" class="py-5" style="display: none;">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-calendar-alt me-2"></i>我的旅游计划
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="plansList" class="text-center text-muted">
                                    <i class="fas fa-calendar-plus fa-3x mb-3"></i>
                                    <p>暂无旅游计划，请先登录并创建计划</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 计划详情区域 -->
        <section id="plan-detail" class="py-5" style="display: none;">
            <div class="container">
                <div class="row">
                    <div class="col-lg-8">
                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-route me-2"></i>旅游计划详情
                                </h5>
                                <button class="btn btn-outline-secondary btn-sm" onclick="showSection('my-plans')">
                                    <i class="fas fa-arrow-left me-1"></i>返回列表
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="planDetailContent">
                                    <!-- 计划详情内容将在这里动态加载 -->
                                </div>
                            </div>
                        </div>
                        
                        <!-- 评论区域 -->
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-comments me-2"></i>评论讨论
                                </h5>
                            </div>
                            <div class="card-body">
                                <!-- 发表评论表单 -->
                                <div class="comment-form mb-4">
                                    <form id="commentForm">
                                        <div class="mb-3">
                                            <textarea class="form-control" id="commentContent" rows="3" 
                                                      placeholder="分享您的想法和体验..." required></textarea>
                                        </div>
                                        <div class="d-flex justify-content-end">
                                            <button type="submit" class="btn btn-primary">
                                                <i class="fas fa-paper-plane me-1"></i>发表评论
                                            </button>
                                        </div>
                                    </form>
                                </div>
                                
                                <!-- 评论列表 -->
                                <div id="commentsList" class="comments-container">
                                    <!-- 评论将在这里动态加载 -->
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-4">
                        <!-- 侧边栏内容 -->
                        <div class="card">
                            <div class="card-header">
                                <h6 class="card-title mb-0">
                                    <i class="fas fa-info-circle me-2"></i>计划信息
                                </h6>
                            </div>
                            <div class="card-body">
                                <div id="planSidebar">
                                    <!-- 侧边栏内容将在这里动态加载 -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- AI助手区域 -->
        <section id="chat" class="py-5" style="display: none;">
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 mx-auto">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">
                                    <i class="fas fa-robot me-2"></i>AI旅游助手
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="chatMessages" class="chat-messages">
                                    <div class="message ai-message">
                                        <div class="message-content">
                                            您好！我是您的AI旅游助手，有什么可以帮助您的吗？
                                        </div>
                                        <div class="message-time">刚刚</div>
                                    </div>
                                </div>
                                <div class="chat-input">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="chatInput" 
                                               placeholder="请输入您的问题...">
                                        <button class="btn btn-primary" id="sendBtn">
                                            <i class="fas fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 登录模态框 -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户登录</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginUsername" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="loginUsername" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">密码</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 注册模态框 -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">用户注册</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="registerUsername" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="registerUsername" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerEmail" class="form-label">邮箱</label>
                            <input type="email" class="form-control" id="registerEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">密码</label>
                            <input type="password" class="form-control" id="registerPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">注册</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载提示 -->
    <div id="loadingToast" class="toast position-fixed top-0 end-0 m-3" role="alert">
        <div class="toast-header">
            <i class="fas fa-spinner fa-spin me-2"></i>
            <strong class="me-auto">处理中</strong>
        </div>
        <div class="toast-body">
            正在处理您的请求，请稍候...
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="static/js/app.js"></script>
</body>
</html>
