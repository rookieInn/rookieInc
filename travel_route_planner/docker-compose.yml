version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: travel_planner_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: travel_planner
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - travel_network
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: travel_planner_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - travel_network
    restart: unless-stopped

  # AI旅游路线规划系统
  app:
    build: .
    container_name: travel_planner_app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@mysql:3306/travel_planner
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      - mysql
      - redis
    networks:
      - travel_network
    restart: unless-stopped
    command: >
      sh -c "
        echo '等待数据库启动...' &&
        sleep 10 &&
        python -c 'from database.database import init_db; init_db()' &&
        echo '数据库初始化完成' &&
        python main.py
      "

  # Nginx反向代理 (可选)
  nginx:
    image: nginx:alpine
    container_name: travel_planner_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - travel_network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  travel_network:
    driver: bridge