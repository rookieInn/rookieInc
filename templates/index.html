<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播间管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-video me-2"></i>直播间管理系统
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 房间状态卡片 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-door-open me-2"></i>房间状态</h5>
                    </div>
                    <div class="card-body">
                        <div id="rooms-container" class="row">
                            <!-- 房间状态将在这里动态加载 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 功能按钮区域 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <button class="btn btn-success btn-lg w-100" data-bs-toggle="modal" data-bs-target="#bookingModal">
                    <i class="fas fa-calendar-plus me-2"></i>新建预约
                </button>
            </div>
            <div class="col-md-6">
                <button class="btn btn-info btn-lg w-100" onclick="refreshData()">
                    <i class="fas fa-sync-alt me-2"></i>刷新数据
                </button>
            </div>
        </div>

        <!-- 预约列表 -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-list me-2"></i>预约列表</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>房间</th>
                                        <th>用户</th>
                                        <th>手机号</th>
                                        <th>开始时间</th>
                                        <th>结束时间</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="bookings-table">
                                    <!-- 预约数据将在这里动态加载 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 访问日志 -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-history me-2"></i>访问日志</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>时间</th>
                                        <th>房间</th>
                                        <th>操作</th>
                                        <th>原因</th>
                                    </tr>
                                </thead>
                                <tbody id="logs-table">
                                    <!-- 日志数据将在这里动态加载 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 预约模态框 -->
    <div class="modal fade" id="bookingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">新建预约</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="booking-form">
                        <div class="mb-3">
                            <label for="room-select" class="form-label">选择房间</label>
                            <select class="form-select" id="room-select" required>
                                <option value="">请选择房间</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="user-name" class="form-label">用户姓名</label>
                            <input type="text" class="form-control" id="user-name" required>
                        </div>
                        <div class="mb-3">
                            <label for="user-phone" class="form-label">手机号</label>
                            <input type="tel" class="form-control" id="user-phone" required>
                        </div>
                        <div class="mb-3">
                            <label for="start-time" class="form-label">开始时间</label>
                            <input type="datetime-local" class="form-control" id="start-time" required>
                        </div>
                        <div class="mb-3">
                            <label for="end-time" class="form-label">结束时间</label>
                            <input type="datetime-local" class="form-control" id="end-time" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="createBooking()">创建预约</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 门禁控制模态框 -->
    <div class="modal fade" id="accessModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">门禁控制</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="access-phone" class="form-label">手机号</label>
                        <input type="tel" class="form-control" id="access-phone" placeholder="请输入预约时使用的手机号">
                    </div>
                    <div id="access-result" class="alert" style="display: none;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" onclick="checkAccess()">验证访问</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
