[doubao]
# 豆包API配置
api_key = your_doubao_api_key_here
base_url = https://ark.cn-beijing.volces.com/api/v3
model_id = ep-20241220102345-xxxxx
max_tokens = 2000
temperature = 0.7

[analysis]
# 分析参数配置
max_keywords = 10
max_summary_length = 200
enable_cache = true
cache_duration = 3600

[logging]
# 日志配置
level = INFO
log_file = doubao_analyzer.log
max_file_size = 10MB
backup_count = 5