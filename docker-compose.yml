version: '3.8'

services:
  # Redis服务
  redis:
    image: redis:7-alpine
    container_name: captcha-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Spring Boot应用
  app:
    build: .
    container_name: captcha-app
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

volumes:
  redis_data: