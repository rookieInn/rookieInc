version: '3.8'

services:
  # 微信群ChatGPT机器人服务
  wechat-bot:
    build:
      context: .
      dockerfile: docker/wechat-bot.Dockerfile
    container_name: wechat-chatgpt-bot
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WECHAT_AUTO_REPLY=true
      - WECHAT_REPLY_GROUPS=true
      - WECHAT_REPLY_PRIVATE=true
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./bot_config.ini:/app/bot_config.ini
      - ./bot_config_advanced.ini:/app/bot_config_advanced.ini
      - ./logs/wechat:/app/logs
      - ./data/wechat:/app/data
    networks:
      - app-network
    depends_on:
      - redis
      - mysql

  # OSS监控仪表板服务
  oss-monitor:
    build:
      context: .
      dockerfile: docker/oss-monitor.Dockerfile
    container_name: oss-monitor-dashboard
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - FLASK_APP=oss_monitor_dashboard.py
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    ports:
      - "5001:5000"
    volumes:
      - ./oss_monitor_config.json:/app/oss_monitor_config.json
      - ./logs/oss:/app/logs
      - ./data/oss:/app/data
    networks:
      - app-network
    depends_on:
      - mysql

  # 页面埋点API服务
  tracking-api:
    build:
      context: .
      dockerfile: docker/tracking-api.Dockerfile
    container_name: tracking-api
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - FLASK_APP=tracking_api.py
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    ports:
      - "5002:5000"
    volumes:
      - ./config.ini:/app/config.ini
      - ./logs/tracking:/app/logs
      - ./data/tracking:/app/data
    networks:
      - app-network
    depends_on:
      - mongodb

  # 视频水印处理服务
  video-watermark:
    build:
      context: .
      dockerfile: docker/video-watermark.Dockerfile
    container_name: video-watermark-service
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=5000
    ports:
      - "5003:5000"
    volumes:
      - ./logs/video:/app/logs
      - ./data/video:/app/data
      - ./data/video/input:/app/data/video/input
      - ./data/video/output:/app/data/video/output
    networks:
      - app-network

  # 书签同步服务
  bookmark-sync:
    build:
      context: .
      dockerfile: docker/bookmark-sync.Dockerfile
    container_name: bookmark-sync-service
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./bookmark_sync_config.json:/app/bookmark_sync_config.json
      - ./logs/bookmark:/app/logs
      - ./data/bookmark:/app/data
    networks:
      - app-network
    depends_on:
      - mysql

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    networks:
      - app-network
    depends_on:
      - oss-monitor
      - tracking-api
      - video-watermark

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network

  # MySQL数据库服务
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-app_db}
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-app_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    ports:
      - "3306:3306"

  # MongoDB数据库服务
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-password}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE:-tracking_db}
    volumes:
      - mongodb-data:/data/db
    networks:
      - app-network
    ports:
      - "27017:27017"

  # 监控服务 - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - app-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # 监控服务 - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - app-network
    depends_on:
      - prometheus

volumes:
  redis-data:
  mysql-data:
  mongodb-data:
  prometheus-data:
  grafana-data:

networks:
  app-network:
    driver: bridge