# AOP操作日志系统配置文件

[operation_log]
# 是否启用操作日志记录
enabled = true

# 存储类型: file, sqlite, mongodb
storage_type = sqlite

# 文件存储配置
log_file = logs/operation_logs.json

# SQLite数据库配置
db_type = sqlite
db_path = data/operation_logs.db

# MongoDB数据库配置
mongodb_host = localhost
mongodb_port = 27017
mongodb_database = operation_logs
mongodb_collection = logs

# 日志级别: DEBUG, INFO, WARNING, ERROR
log_level = INFO

# 是否记录请求参数
include_params = true

# 是否记录响应数据
include_response = true

# 是否记录请求信息
include_request_info = true

# 日志保留天数
retention_days = 30

# 是否启用异步记录
async_logging = false

# 批量记录大小
batch_size = 100

# 是否启用性能监控
performance_monitoring = true

# 慢查询阈值（毫秒）
slow_query_threshold = 1000

[tracking_api]
# 埋点API配置
host = 0.0.0.0
port = 5000
debug = true
enable_cors = true
api_key = 

[mongodb]
# MongoDB连接配置
host = localhost
port = 27017
username = 
password = 
database = tracking

[operation_log_web]
# 操作日志Web界面配置
host = 0.0.0.0
port = 5001
debug = true

[demo_admin]
# 演示管理系统配置
host = 0.0.0.0
port = 5002
debug = true