<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>优惠券中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .coupon-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            color: white;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .coupon-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .coupon-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: rotate(45deg);
        }
        
        .coupon-type-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .discount-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .coupon-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .coupon-description {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 15px;
        }
        
        .coupon-conditions {
            font-size: 0.8rem;
            opacity: 0.8;
        }
        
        .expired-coupon {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            opacity: 0.7;
        }
        
        .used-coupon {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            opacity: 0.8;
        }
        
        .coupon-tabs {
            border-bottom: 2px solid #e9ecef;
            margin-bottom: 30px;
        }
        
        .coupon-tab {
            padding: 10px 20px;
            border: none;
            background: none;
            color: #6c757d;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }
        
        .coupon-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 30px;
        }
        
        .search-box input {
            padding-left: 40px;
            border-radius: 25px;
            border: 2px solid #e9ecef;
        }
        
        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
        
        .filter-buttons {
            margin-bottom: 20px;
        }
        
        .filter-btn {
            margin-right: 10px;
            margin-bottom: 10px;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 0.9rem;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .coupon-stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- 顶部导航 -->
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">
                    <i class="bi bi-ticket-perforated text-primary"></i> 优惠券中心
                </a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="#" onclick="showMyCoupons()">
                        <i class="bi bi-person-circle"></i> 我的优惠券
                    </a>
                </div>
            </div>
        </nav>

        <div class="container">
            <!-- 统计信息 -->
            <div class="coupon-stats">
                <div class="row">
                    <div class="col-md-3">
                        <div class="stat-item">
                            <div class="stat-number" id="totalAvailable">0</div>
                            <div class="stat-label">可用优惠券</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-item">
                            <div class="stat-number" id="myCoupons">0</div>
                            <div class="stat-label">我的优惠券</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-item">
                            <div class="stat-number" id="savedAmount">¥0</div>
                            <div class="stat-label">已节省金额</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-item">
                            <div class="stat-number" id="expiringSoon">0</div>
                            <div class="stat-label">即将过期</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 搜索和筛选 -->
            <div class="search-box">
                <i class="bi bi-search"></i>
                <input type="text" class="form-control" id="searchInput" placeholder="搜索优惠券名称或代码">
            </div>

            <div class="filter-buttons">
                <button class="btn btn-outline-primary filter-btn active" onclick="filterCoupons('all')">全部</button>
                <button class="btn btn-outline-primary filter-btn" onclick="filterCoupons('fixed_amount')">满减券</button>
                <button class="btn btn-outline-primary filter-btn" onclick="filterCoupons('percentage')">折扣券</button>
                <button class="btn btn-outline-primary filter-btn" onclick="filterCoupons('free_shipping')">免运费</button>
                <button class="btn btn-outline-primary filter-btn" onclick="filterCoupons('my')">我的优惠券</button>
            </div>

            <!-- 优惠券标签页 -->
            <div class="coupon-tabs">
                <button class="coupon-tab active" onclick="showTab('available')">可用优惠券</button>
                <button class="coupon-tab" onclick="showTab('my')">我的优惠券</button>
                <button class="coupon-tab" onclick="showTab('used')">已使用</button>
                <button class="coupon-tab" onclick="showTab('expired')">已过期</button>
            </div>

            <!-- 优惠券列表 -->
            <div id="couponsContainer">
                <!-- 优惠券将通过JavaScript动态加载 -->
            </div>

            <!-- 空状态 -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="bi bi-ticket-perforated"></i>
                <h4>暂无优惠券</h4>
                <p>当前没有可用的优惠券，请稍后再来看看</p>
            </div>
        </div>
    </div>

    <!-- 优惠券详情模态框 -->
    <div class="modal fade" id="couponDetailModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">优惠券详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="couponDetailContent">
                    <!-- 详情内容将通过JavaScript动态加载 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="claimOrUseBtn" onclick="claimOrUseCoupon()">领取</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量
        let currentTab = 'available';
        let currentFilter = 'all';
        let currentUserId = 1; // 实际应用中从认证信息获取
        let availableCoupons = [];
        let myCoupons = [];

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadAvailableCoupons();
            loadMyCoupons();
            loadStatistics();
        });

        // 加载可用优惠券
        async function loadAvailableCoupons() {
            try {
                const response = await fetch(`/api/coupons/available?user_id=${currentUserId}`);
                const result = await response.json();

                if (result.success) {
                    availableCoupons = result.data;
                    renderCoupons(availableCoupons);
                } else {
                    console.error('加载可用优惠券失败:', result.message);
                }
            } catch (error) {
                console.error('加载可用优惠券失败:', error);
            }
        }

        // 加载我的优惠券
        async function loadMyCoupons() {
            try {
                const response = await fetch(`/api/users/${currentUserId}/coupons`);
                const result = await response.json();

                if (result.success) {
                    myCoupons = result.data;
                    updateStatistics();
                } else {
                    console.error('加载我的优惠券失败:', result.message);
                }
            } catch (error) {
                console.error('加载我的优惠券失败:', error);
            }
        }

        // 加载统计数据
        function loadStatistics() {
            // 这里应该调用统计API，暂时使用模拟数据
            document.getElementById('totalAvailable').textContent = availableCoupons.length;
            document.getElementById('myCoupons').textContent = myCoupons.length;
            document.getElementById('savedAmount').textContent = '¥128';
            document.getElementById('expiringSoon').textContent = '3';
        }

        // 更新统计数据
        function updateStatistics() {
            document.getElementById('totalAvailable').textContent = availableCoupons.length;
            document.getElementById('myCoupons').textContent = myCoupons.length;
            
            // 计算已节省金额
            const usedCoupons = myCoupons.filter(c => c.status === 'used');
            const savedAmount = usedCoupons.reduce((sum, coupon) => {
                return sum + (coupon.discount_amount || 0);
            }, 0);
            document.getElementById('savedAmount').textContent = `¥${savedAmount.toFixed(2)}`;
            
            // 计算即将过期的优惠券
            const now = new Date();
            const expiringSoon = myCoupons.filter(c => {
                if (c.status !== 'unused') return false;
                const expireDate = new Date(c.valid_until);
                const daysLeft = (expireDate - now) / (1000 * 60 * 60 * 24);
                return daysLeft <= 3 && daysLeft > 0;
            }).length;
            document.getElementById('expiringSoon').textContent = expiringSoon;
        }

        // 渲染优惠券列表
        function renderCoupons(coupons) {
            const container = document.getElementById('couponsContainer');
            const emptyState = document.getElementById('emptyState');
            
            if (coupons.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            const filteredCoupons = filterCouponsByType(coupons);
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const searchFilteredCoupons = filteredCoupons.filter(coupon => 
                coupon.name.toLowerCase().includes(searchTerm) || 
                coupon.code.toLowerCase().includes(searchTerm)
            );
            
            container.innerHTML = '';
            
            searchFilteredCoupons.forEach(coupon => {
                const couponCard = createCouponCard(coupon);
                container.appendChild(couponCard);
            });
        }

        // 创建优惠券卡片
        function createCouponCard(coupon) {
            const card = document.createElement('div');
            card.className = 'col-md-6 col-lg-4';
            
            let cardClass = 'coupon-card';
            if (coupon.status === 'expired') cardClass += ' expired-coupon';
            if (coupon.status === 'used') cardClass += ' used-coupon';
            
            card.innerHTML = `
                <div class="${cardClass}" onclick="showCouponDetail(${coupon.id})">
                    <div class="coupon-type-badge">${getCouponTypeText(coupon.coupon_type)}</div>
                    <div class="discount-value">${formatDiscountValue(coupon.coupon_type, coupon.discount_value)}</div>
                    <div class="coupon-name">${coupon.name}</div>
                    <div class="coupon-description">${coupon.description || ''}</div>
                    <div class="coupon-conditions">
                        ${coupon.min_order_amount > 0 ? `满¥${coupon.min_order_amount}可用` : '无门槛使用'}
                        ${coupon.valid_until ? ` · 有效期至${formatDate(coupon.valid_until)}` : ''}
                    </div>
                </div>
            `;
            
            return card;
        }

        // 按类型筛选优惠券
        function filterCouponsByType(coupons) {
            if (currentFilter === 'all') return coupons;
            if (currentFilter === 'my') return myCoupons;
            return coupons.filter(coupon => coupon.coupon_type === currentFilter);
        }

        // 筛选优惠券
        function filterCoupons(type) {
            currentFilter = type;
            
            // 更新按钮状态
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 根据当前标签页渲染
            if (currentTab === 'available') {
                renderCoupons(availableCoupons);
            } else if (currentTab === 'my') {
                renderCoupons(myCoupons);
            }
        }

        // 显示标签页
        function showTab(tab) {
            currentTab = tab;
            
            // 更新标签状态
            document.querySelectorAll('.coupon-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 根据标签页渲染对应数据
            if (tab === 'available') {
                renderCoupons(availableCoupons);
            } else if (tab === 'my') {
                renderCoupons(myCoupons);
            } else if (tab === 'used') {
                const usedCoupons = myCoupons.filter(c => c.status === 'used');
                renderCoupons(usedCoupons);
            } else if (tab === 'expired') {
                const expiredCoupons = myCoupons.filter(c => c.status === 'expired');
                renderCoupons(expiredCoupons);
            }
        }

        // 显示优惠券详情
        function showCouponDetail(couponId) {
            const coupon = [...availableCoupons, ...myCoupons].find(c => c.id === couponId);
            if (!coupon) return;
            
            const content = document.getElementById('couponDetailContent');
            const claimBtn = document.getElementById('claimOrUseBtn');
            
            content.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <h6>基本信息</h6>
                        <table class="table table-sm">
                            <tr><td>优惠券代码</td><td><code>${coupon.code}</code></td></tr>
                            <tr><td>名称</td><td>${coupon.name}</td></tr>
                            <tr><td>类型</td><td>${getCouponTypeText(coupon.coupon_type)}</td></tr>
                            <tr><td>折扣值</td><td>${formatDiscountValue(coupon.coupon_type, coupon.discount_value)}</td></tr>
                            <tr><td>最低订单金额</td><td>¥${coupon.min_order_amount}</td></tr>
                        </table>
                    </div>
                    <div class="col-md-6">
                        <h6>使用条件</h6>
                        <table class="table table-sm">
                            <tr><td>有效期</td><td>${formatDate(coupon.valid_until)}</td></tr>
                            <tr><td>每用户限用</td><td>${coupon.per_user_limit}次</td></tr>
                            <tr><td>剩余数量</td><td>${coupon.remaining_quantity || '无限制'}</td></tr>
                            <tr><td>状态</td><td>${getStatusText(coupon.status)}</td></tr>
                        </table>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-md-12">
                        <h6>描述</h6>
                        <p>${coupon.description || '无描述'}</p>
                    </div>
                </div>
            `;
            
            // 设置按钮文本和点击事件
            if (coupon.is_claimed) {
                claimBtn.textContent = '已领取';
                claimBtn.disabled = true;
                claimBtn.className = 'btn btn-secondary';
            } else {
                claimBtn.textContent = '立即领取';
                claimBtn.disabled = false;
                claimBtn.className = 'btn btn-primary';
                claimBtn.onclick = () => claimCoupon(coupon.id);
            }
            
            new bootstrap.Modal(document.getElementById('couponDetailModal')).show();
        }

        // 领取优惠券
        async function claimCoupon(couponId) {
            try {
                const response = await fetch('/api/coupons/claim', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        coupon_id: couponId,
                        user_id: currentUserId
                    })
                });

                const result = await response.json();

                if (result.success) {
                    alert('优惠券领取成功！');
                    bootstrap.Modal.getInstance(document.getElementById('couponDetailModal')).hide();
                    loadAvailableCoupons();
                    loadMyCoupons();
                } else {
                    alert('领取失败: ' + result.message);
                }
            } catch (error) {
                console.error('领取优惠券失败:', error);
                alert('领取失败: ' + error.message);
            }
        }

        // 显示我的优惠券
        function showMyCoupons() {
            showTab('my');
        }

        // 工具函数
        function getCouponTypeText(type) {
            const types = {
                'fixed_amount': '满减券',
                'percentage': '折扣券',
                'free_shipping': '免运费',
                'buy_x_get_y': '买X送Y',
                'cashback': '返现券'
            };
            return types[type] || type;
        }

        function formatDiscountValue(type, value) {
            if (type === 'percentage') {
                return value + '折';
            } else if (type === 'free_shipping') {
                return '免运费';
            } else {
                return '¥' + value;
            }
        }

        function getStatusText(status) {
            const statuses = {
                'unused': '未使用',
                'used': '已使用',
                'expired': '已过期',
                'cancelled': '已取消'
            };
            return statuses[status] || status;
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString('zh-CN');
        }

        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', function() {
            if (currentTab === 'available') {
                renderCoupons(availableCoupons);
            } else if (currentTab === 'my') {
                renderCoupons(myCoupons);
            }
        });
    </script>
</body>
</html>
