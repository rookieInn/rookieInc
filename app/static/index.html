<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅游路线规划智能体</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="gradient-bg shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-route text-white text-2xl mr-3"></i>
                    <h1 class="text-white text-xl font-bold">旅游路线规划智能体</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="loginBtn" class="text-white hover:text-gray-200 px-3 py-2 rounded-md text-sm font-medium">
                        <i class="fas fa-sign-in-alt mr-2"></i>登录
                    </button>
                    <button id="registerBtn" class="bg-white text-purple-600 hover:bg-gray-100 px-4 py-2 rounded-md text-sm font-medium">
                        <i class="fas fa-user-plus mr-2"></i>注册
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
        <!-- 欢迎区域 -->
        <div class="text-center mb-12">
            <h2 class="text-4xl font-bold text-gray-900 mb-4">
                智能规划您的完美旅程
            </h2>
            <p class="text-xl text-gray-600 max-w-3xl mx-auto">
                基于AI技术的个性化旅游路线规划，为您推荐最优景点、住宿和交通方案
            </p>
        </div>

        <!-- 规划表单 -->
        <div class="bg-white rounded-lg shadow-xl p-8 mb-12">
            <h3 class="text-2xl font-bold text-gray-900 mb-6">
                <i class="fas fa-map-marked-alt text-purple-600 mr-3"></i>
                开始规划您的旅程
            </h3>
            
            <form id="travelForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 目的地 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-map-marker-alt mr-2"></i>目的地
                        </label>
                        <select id="destination" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">请选择目的地</option>
                            <option value="北京">北京</option>
                            <option value="上海">上海</option>
                            <option value="杭州">杭州</option>
                            <option value="西安">西安</option>
                            <option value="成都">成都</option>
                        </select>
                    </div>

                    <!-- 旅行日期 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-calendar-alt mr-2"></i>旅行日期
                        </label>
                        <input type="date" id="travelDates" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </div>

                    <!-- 行程天数 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-clock mr-2"></i>行程天数
                        </label>
                        <select id="durationDays" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="1">1天</option>
                            <option value="2">2天</option>
                            <option value="3" selected>3天</option>
                            <option value="4">4天</option>
                            <option value="5">5天</option>
                            <option value="7">7天</option>
                        </select>
                    </div>

                    <!-- 预算范围 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-dollar-sign mr-2"></i>预算范围
                        </label>
                        <select id="budget" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">请选择预算范围</option>
                            <option value="经济型">经济型 (500-1000元/天)</option>
                            <option value="中等">中等 (1000-2000元/天)</option>
                            <option value="豪华">豪华 (2000元以上/天)</option>
                        </select>
                    </div>

                    <!-- 旅行风格 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-heart mr-2"></i>旅行风格
                        </label>
                        <select id="travelStyle" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500">
                            <option value="">请选择旅行风格</option>
                            <option value="独自旅行">独自旅行</option>
                            <option value="亲子游">亲子游</option>
                            <option value="蜜月游">蜜月游</option>
                            <option value="朋友聚会">朋友聚会</option>
                            <option value="商务出行">商务出行</option>
                        </select>
                    </div>

                    <!-- 人数 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">
                            <i class="fas fa-users mr-2"></i>人数
                        </label>
                        <input type="number" id="groupSize" min="1" max="20" value="1" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </div>
                </div>

                <!-- 兴趣点 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-star mr-2"></i>兴趣点 (可多选)
                    </label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                        <label class="flex items-center">
                            <input type="checkbox" value="历史文化" class="mr-2">
                            <span class="text-sm">历史文化</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" value="自然风光" class="mr-2">
                            <span class="text-sm">自然风光</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" value="美食" class="mr-2">
                            <span class="text-sm">美食</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" value="购物" class="mr-2">
                            <span class="text-sm">购物</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" value="娱乐" class="mr-2">
                            <span class="text-sm">娱乐</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" value="艺术" class="mr-2">
                            <span class="text-sm">艺术</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" value="运动" class="mr-2">
                            <span class="text-sm">运动</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" value="宗教" class="mr-2">
                            <span class="text-sm">宗教</span>
                        </label>
                    </div>
                </div>

                <!-- 特殊要求 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-comment mr-2"></i>特殊要求
                    </label>
                    <textarea id="specialRequirements" rows="3" placeholder="请描述您的特殊要求，如无障碍设施、饮食限制等" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
                </div>

                <!-- 提交按钮 -->
                <div class="text-center">
                    <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-lg text-lg transition duration-300 ease-in-out transform hover:scale-105">
                        <i class="fas fa-magic mr-2"></i>
                        生成智能路线规划
                    </button>
                </div>
            </form>
        </div>

        <!-- 结果展示区域 -->
        <div id="resultArea" class="hidden">
            <div class="bg-white rounded-lg shadow-xl p-8">
                <h3 class="text-2xl font-bold text-gray-900 mb-6">
                    <i class="fas fa-route text-green-600 mr-3"></i>
                    您的专属路线规划
                </h3>
                <div id="routeResult" class="space-y-6">
                    <!-- 路线规划结果将在这里显示 -->
                </div>
            </div>
        </div>

        <!-- 热门目的地 -->
        <div class="mt-12">
            <h3 class="text-2xl font-bold text-gray-900 mb-6 text-center">
                <i class="fas fa-fire mr-3 text-red-500"></i>
                热门目的地
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-6">
                <div class="card-hover bg-white rounded-lg shadow-md p-6 text-center">
                    <i class="fas fa-landmark text-4xl text-red-500 mb-3"></i>
                    <h4 class="font-bold text-lg">北京</h4>
                    <p class="text-gray-600 text-sm">历史文化名城</p>
                </div>
                <div class="card-hover bg-white rounded-lg shadow-md p-6 text-center">
                    <i class="fas fa-building text-4xl text-blue-500 mb-3"></i>
                    <h4 class="font-bold text-lg">上海</h4>
                    <p class="text-gray-600 text-sm">现代化国际都市</p>
                </div>
                <div class="card-hover bg-white rounded-lg shadow-md p-6 text-center">
                    <i class="fas fa-leaf text-4xl text-green-500 mb-3"></i>
                    <h4 class="font-bold text-lg">杭州</h4>
                    <p class="text-gray-600 text-sm">人间天堂</p>
                </div>
                <div class="card-hover bg-white rounded-lg shadow-md p-6 text-center">
                    <i class="fas fa-horse text-4xl text-yellow-500 mb-3"></i>
                    <h4 class="font-bold text-lg">西安</h4>
                    <p class="text-gray-600 text-sm">古都长安</p>
                </div>
                <div class="card-hover bg-white rounded-lg shadow-md p-6 text-center">
                    <i class="fas fa-paw text-4xl text-pink-500 mb-3"></i>
                    <h4 class="font-bold text-lg">成都</h4>
                    <p class="text-gray-600 text-sm">天府之国</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="gradient-bg text-white py-8 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p>&copy; 2024 旅游路线规划智能体. 基于AI技术的个性化旅游规划服务.</p>
        </div>
    </footer>

    <script>
        // 表单提交处理
        document.getElementById('travelForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 收集表单数据
            const formData = {
                destination: document.getElementById('destination').value,
                travel_dates: document.getElementById('travelDates').value,
                duration_days: parseInt(document.getElementById('durationDays').value),
                budget: document.getElementById('budget').value,
                travel_style: document.getElementById('travelStyle').value,
                group_size: parseInt(document.getElementById('groupSize').value),
                special_requirements: document.getElementById('specialRequirements').value,
                interests: Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value)
            };
            
            // 验证必填字段
            if (!formData.destination || !formData.travel_dates || !formData.budget) {
                alert('请填写所有必填字段');
                return;
            }
            
            try {
                // 显示加载状态
                const submitBtn = e.target.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>正在生成路线规划...';
                submitBtn.disabled = true;
                
                // 发送请求到API
                const response = await fetch('/api/v1/plan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + (localStorage.getItem('token') || 'demo-token')
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayRouteResult(result.route_plan);
                } else {
                    alert('生成路线规划失败: ' + result.error);
                }
                
            } catch (error) {
                console.error('Error:', error);
                alert('请求失败，请稍后重试');
            } finally {
                // 恢复按钮状态
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
        
        // 显示路线规划结果
        function displayRouteResult(routePlan) {
            const resultArea = document.getElementById('resultArea');
            const routeResult = document.getElementById('routeResult');
            
            let html = `
                <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
                    <h4 class="font-bold text-green-800 mb-2">
                        <i class="fas fa-check-circle mr-2"></i>
                        路线规划生成成功！
                    </h4>
                    <p class="text-green-700">目的地：${routePlan.destination} | 行程：${routePlan.duration_days}天</p>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-blue-50 rounded-lg p-6">
                        <h5 class="font-bold text-blue-800 mb-3">
                            <i class="fas fa-calculator mr-2"></i>预算估算
                        </h5>
                        <p class="text-2xl font-bold text-blue-600">¥${routePlan.budget_estimate.total_estimate}</p>
                        <div class="mt-3 space-y-1">
                            <div class="flex justify-between text-sm">
                                <span>住宿：</span>
                                <span>¥${routePlan.budget_estimate.breakdown.accommodation}</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span>餐饮：</span>
                                <span>¥${routePlan.budget_estimate.breakdown.meals}</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span>交通：</span>
                                <span>¥${routePlan.budget_estimate.breakdown.transportation}</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span>景点：</span>
                                <span>¥${routePlan.budget_estimate.breakdown.attractions}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="bg-purple-50 rounded-lg p-6">
                        <h5 class="font-bold text-purple-800 mb-3">
                            <i class="fas fa-bed mr-2"></i>推荐住宿
                        </h5>
                        <h6 class="font-semibold text-purple-700">${routePlan.accommodation.name}</h6>
                        <p class="text-sm text-purple-600 mt-1">${routePlan.accommodation.reason}</p>
                    </div>
                </div>
                
                <div class="mt-6">
                    <h5 class="font-bold text-gray-800 mb-4">
                        <i class="fas fa-calendar-day mr-2"></i>每日行程安排
                    </h5>
                    <div class="space-y-4">
            `;
            
            routePlan.daily_itinerary.forEach(day => {
                html += `
                    <div class="border border-gray-200 rounded-lg p-4">
                        <h6 class="font-semibold text-gray-700 mb-2">第${day.day}天 - ${day.date}</h6>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                            <div>
                                <span class="font-medium text-orange-600">上午：</span>
                                <p class="text-gray-600">${day.morning}</p>
                            </div>
                            <div>
                                <span class="font-medium text-blue-600">下午：</span>
                                <p class="text-gray-600">${day.afternoon}</p>
                            </div>
                            <div>
                                <span class="font-medium text-purple-600">晚上：</span>
                                <p class="text-gray-600">${day.evening}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
                
                <div class="mt-6">
                    <h5 class="font-bold text-gray-800 mb-4">
                        <i class="fas fa-lightbulb mr-2"></i>旅行贴士
                    </h5>
                    <ul class="list-disc list-inside space-y-1 text-gray-600">
            `;
            
            routePlan.tips.forEach(tip => {
                html += `<li>${tip}</li>`;
            });
            
            html += `
                    </ul>
                </div>
            `;
            
            routeResult.innerHTML = html;
            resultArea.classList.remove('hidden');
            resultArea.scrollIntoView({ behavior: 'smooth' });
        }
        
        // 设置默认日期为明天
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('travelDates').value = tomorrow.toISOString().split('T')[0];
    </script>
</body>
</html>
