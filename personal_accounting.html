<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人记账本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card.income {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .stat-card.expense {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }

        .stat-card.balance {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
        }

        .btn-edit {
            background: linear-gradient(135deg, #feca57 0%, #ff9ff3 100%);
        }

        .records-section {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .section-header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #e1e5e9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }

        .search-box {
            padding: 8px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 20px;
            width: 250px;
            font-size: 0.9rem;
        }

        .records-table {
            width: 100%;
            border-collapse: collapse;
        }

        .records-table th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e1e5e9;
        }

        .records-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        .records-table tr:hover {
            background: #f8f9fa;
        }

        .type-income {
            color: #28a745;
            font-weight: bold;
        }

        .type-expense {
            color: #dc3545;
            font-weight: bold;
        }

        .category-tag {
            background: #e9ecef;
            color: #495057;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            display: inline-block;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .no-records {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .chart-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .chart-placeholder {
            height: 300px;
            background: #f8f9fa;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .records-table {
                font-size: 0.9rem;
            }
            
            .search-box {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 个人记账本</h1>
            <p>简单、快捷、高效的财务管理工具</p>
        </div>

        <div class="main-content">
            <!-- 统计卡片 -->
            <div class="stats-grid">
                <div class="stat-card income">
                    <div class="stat-value" id="totalIncome">¥0</div>
                    <div class="stat-label">总收入</div>
                </div>
                <div class="stat-card expense">
                    <div class="stat-value" id="totalExpense">¥0</div>
                    <div class="stat-label">总支出</div>
                </div>
                <div class="stat-card balance">
                    <div class="stat-value" id="balance">¥0</div>
                    <div class="stat-label">余额</div>
                </div>
            </div>

            <!-- 添加记录表单 -->
            <div class="form-section">
                <h2 style="margin-bottom: 20px; color: #333;">添加新记录</h2>
                <form id="recordForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="type">类型</label>
                            <select id="type" required>
                                <option value="income">收入</option>
                                <option value="expense">支出</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="amount">金额</label>
                            <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label for="category">分类</label>
                            <select id="category" required>
                                <option value="餐饮">餐饮</option>
                                <option value="交通">交通</option>
                                <option value="购物">购物</option>
                                <option value="娱乐">娱乐</option>
                                <option value="医疗">医疗</option>
                                <option value="教育">教育</option>
                                <option value="工资">工资</option>
                                <option value="投资">投资</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="description">描述</label>
                            <input type="text" id="description" placeholder="记录详情...">
                        </div>
                        <div class="form-group">
                            <label for="date">日期</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group" style="display: flex; align-items: end;">
                            <button type="submit" class="btn">添加记录</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- 记录列表 -->
            <div class="records-section">
                <div class="section-header">
                    <div class="section-title">记录列表</div>
                    <input type="text" class="search-box" id="searchInput" placeholder="搜索记录...">
                </div>
                <div style="overflow-x: auto;">
                    <table class="records-table">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>类型</th>
                                <th>分类</th>
                                <th>描述</th>
                                <th>金额</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="recordsTableBody">
                            <tr>
                                <td colspan="6" class="no-records">暂无记录，请添加您的第一条记录</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 图表区域 -->
            <div class="chart-container">
                <div class="chart-title">支出分类统计</div>
                <div class="chart-placeholder" id="chartPlaceholder">
                    图表功能开发中...
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let records = JSON.parse(localStorage.getItem('accountingRecords')) || [];
        let editingId = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 设置默认日期为今天
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
            
            // 加载数据
            loadRecords();
            updateStats();
            
            // 绑定事件
            document.getElementById('recordForm').addEventListener('submit', handleSubmit);
            document.getElementById('searchInput').addEventListener('input', handleSearch);
        });

        // 处理表单提交
        function handleSubmit(e) {
            e.preventDefault();
            
            const formData = {
                id: editingId || Date.now(),
                type: document.getElementById('type').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                description: document.getElementById('description').value,
                date: document.getElementById('date').value
            };

            if (editingId) {
                // 编辑模式
                const index = records.findIndex(r => r.id === editingId);
                records[index] = formData;
                editingId = null;
            } else {
                // 添加模式
                records.unshift(formData);
            }

            // 保存到本地存储
            localStorage.setItem('accountingRecords', JSON.stringify(records));
            
            // 重新加载数据
            loadRecords();
            updateStats();
            
            // 重置表单
            document.getElementById('recordForm').reset();
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
        }

        // 加载记录
        function loadRecords(searchTerm = '') {
            const tbody = document.getElementById('recordsTableBody');
            let filteredRecords = records;

            if (searchTerm) {
                filteredRecords = records.filter(record => 
                    record.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    record.category.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            if (filteredRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-records">暂无记录</td></tr>';
                return;
            }

            tbody.innerHTML = filteredRecords.map(record => `
                <tr>
                    <td>${record.date}</td>
                    <td><span class="type-${record.type}">${record.type === 'income' ? '收入' : '支出'}</span></td>
                    <td><span class="category-tag">${record.category}</span></td>
                    <td>${record.description || '-'}</td>
                    <td class="type-${record.type}">${record.type === 'income' ? '+' : '-'}¥${record.amount.toFixed(2)}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="action-btn btn-edit" onclick="editRecord(${record.id})">编辑</button>
                            <button class="action-btn btn-danger" onclick="deleteRecord(${record.id})">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // 更新统计
        function updateStats() {
            const income = records.filter(r => r.type === 'income').reduce((sum, r) => sum + r.amount, 0);
            const expense = records.filter(r => r.type === 'expense').reduce((sum, r) => sum + r.amount, 0);
            const balance = income - expense;

            document.getElementById('totalIncome').textContent = `¥${income.toFixed(2)}`;
            document.getElementById('totalExpense').textContent = `¥${expense.toFixed(2)}`;
            document.getElementById('balance').textContent = `¥${balance.toFixed(2)}`;
        }

        // 编辑记录
        function editRecord(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            editingId = id;
            document.getElementById('type').value = record.type;
            document.getElementById('amount').value = record.amount;
            document.getElementById('category').value = record.category;
            document.getElementById('description').value = record.description;
            document.getElementById('date').value = record.date;

            // 滚动到表单
            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
        }

        // 删除记录
        function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？')) {
                records = records.filter(r => r.id !== id);
                localStorage.setItem('accountingRecords', JSON.stringify(records));
                loadRecords();
                updateStats();
            }
        }

        // 搜索功能
        function handleSearch(e) {
            loadRecords(e.target.value);
        }

        // 简单的图表功能（使用CSS条形图）
        function updateChart() {
            const expenseRecords = records.filter(r => r.type === 'expense');
            const categoryTotals = {};
            
            expenseRecords.forEach(record => {
                categoryTotals[record.category] = (categoryTotals[record.category] || 0) + record.amount;
            });

            const chartContainer = document.getElementById('chartPlaceholder');
            const maxAmount = Math.max(...Object.values(categoryTotals));
            
            if (maxAmount === 0) {
                chartContainer.innerHTML = '暂无支出数据';
                return;
            }

            chartContainer.innerHTML = Object.entries(categoryTotals)
                .sort((a, b) => b[1] - a[1])
                .map(([category, amount]) => {
                    const percentage = (amount / maxAmount) * 100;
                    return `
                        <div style="margin-bottom: 15px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                                <span>${category}</span>
                                <span>¥${amount.toFixed(2)}</span>
                            </div>
                            <div style="background: #e9ecef; height: 20px; border-radius: 10px; overflow: hidden;">
                                <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100%; width: ${percentage}%; transition: width 0.3s ease;"></div>
                            </div>
                        </div>
                    `;
                }).join('');
        }

        // 在数据更新后更新图表
        const originalLoadRecords = loadRecords;
        loadRecords = function(searchTerm) {
            originalLoadRecords(searchTerm);
            updateChart();
        };
    </script>
</body>
</html>
